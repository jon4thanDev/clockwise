name: Clockwise
options:
  bundleIdPrefix: com.tan.clockwise
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 9P2K2679GT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Clockwise:
    type: application
    platform: iOS
    sources:
      - Clockwise
      - Shared
    dependencies:
      - target: ClockwiseWidget
    entitlements:
      path: Clockwise/Resources/Clockwise.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tan.clockwise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tan.clockwise.app
        INFOPLIST_FILE: Clockwise/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  ClockwiseWidget:
    type: app-extension
    platform: iOS
    sources:
      - ClockwiseWidget
      - Shared
    entitlements:
      path: ClockwiseWidget/ClockwiseWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tan.clockwise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tan.clockwise.app.widget
        INFOPLIST_FILE: ClockwiseWidget/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  ClockwiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClockwiseTests
    dependencies:
      - target: Clockwise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tan.clockwise.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Clockwise:
    build:
      targets:
        Clockwise: all
        ClockwiseTests: [test]
    test:
      targets:
        - ClockwiseTests
